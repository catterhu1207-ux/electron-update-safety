[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "electron-update-safety"
version = "0.1.1"
description = "Hash-gated staging and isolated lifecycle checks for Windows Electron updates"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "catte"}]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: Microsoft :: Windows"]

[project.scripts]
electron-update-safety = "electron_update_safety.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
